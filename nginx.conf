server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Revalidate local assets so widget updates appear after rebuilding.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.vtt$ {
        types { text/vtt vtt; }
        try_files $uri =404;
    }
}
