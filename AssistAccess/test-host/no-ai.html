<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Host page without a configured AI service</title>
  <style>
    body { margin: 0; font: 16px/1.5 system-ui, sans-serif; color: #172554; background: #f7faff; }
    header, main { max-width: 840px; margin: auto; padding: 1rem; }
    section { margin: 1.5rem 0; padding: 1rem; background: white; border: 1px solid #dbeafe; border-radius: 12px; }
    img { max-width: 100%; height: auto; }
  </style>
  <script>
    // This site has not configured an authorized alt-text service at all.
    // The widget must say so and must not pretend that a suggestion was produced.
    window.AssistAccessConfig = {
      position: { corner: 'right-middle', offsetX: 8, offsetY: 16 },
      altText: { enabled: false },
    };
  </script>
  <script defer src="/embed/assistaccess.js"></script>
</head>
<body>
  <header><h1>Site without an alt-text service</h1></header>
  <main>
    <section><h2>Sales report</h2>
      <img id="unconfigured-image" src="/test-host/images/chart.png">
    </section>
  </main>
</body>
</html>
